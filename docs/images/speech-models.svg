<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Speech models: accuracy against speed</title>
<desc id="d">Word error rate against time per command for four speech models. Parakeet makes the fewest errors (9.4%) in 1.1 s; Moonshine 10.4% in 0.5 s; Zipformer 17.9% in 0.3 s; Whisper small 15.1% in 4.6 s.</desc>
<style>
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
  .grid { stroke: #e4e3df; } .axis { stroke: #b9b8b2; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; }
  .rule { stroke: #8a8984; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55554f; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; }
    .rule { stroke: #8f8e88; }
  }
  .line { fill: none; }   /* after the dark colours, so a line is never filled */
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<rect class="bg" width="720" height="420" rx="8"/>
<text class="ink" x="70" y="30" font-size="17" font-weight="600">Speech models: accuracy against speed</text>
<text class="ink2" x="70" y="50" font-size="13">Same 17 clips on a 4-core Xeon VM without AVX2. Up and to the left is better.</text>
<line class="grid" x1="70" x2="680" y1="70.0" y2="70.0"/>
<text class="ink2" x="62" y="74.0" font-size="12" text-anchor="end">8%</text>
<line class="grid" x1="70" x2="680" y1="118.3" y2="118.3"/>
<text class="ink2" x="62" y="122.3" font-size="12" text-anchor="end">10%</text>
<line class="grid" x1="70" x2="680" y1="166.7" y2="166.7"/>
<text class="ink2" x="62" y="170.7" font-size="12" text-anchor="end">12%</text>
<line class="grid" x1="70" x2="680" y1="215.0" y2="215.0"/>
<text class="ink2" x="62" y="219.0" font-size="12" text-anchor="end">14%</text>
<line class="grid" x1="70" x2="680" y1="263.3" y2="263.3"/>
<text class="ink2" x="62" y="267.3" font-size="12" text-anchor="end">16%</text>
<line class="grid" x1="70" x2="680" y1="311.7" y2="311.7"/>
<text class="ink2" x="62" y="315.7" font-size="12" text-anchor="end">18%</text>
<line class="grid" x1="70" x2="680" y1="360.0" y2="360.0"/>
<text class="ink2" x="62" y="364.0" font-size="12" text-anchor="end">20%</text>
<text class="ink2" x="70.0" y="380" font-size="12" text-anchor="middle">0 s</text>
<text class="ink2" x="192.0" y="380" font-size="12" text-anchor="middle">1 s</text>
<text class="ink2" x="314.0" y="380" font-size="12" text-anchor="middle">2 s</text>
<text class="ink2" x="436.0" y="380" font-size="12" text-anchor="middle">3 s</text>
<text class="ink2" x="558.0" y="380" font-size="12" text-anchor="middle">4 s</text>
<text class="ink2" x="680.0" y="380" font-size="12" text-anchor="middle">5 s</text>
<line class="axis" x1="70" x2="680" y1="360" y2="360"/>
<text class="ink2" x="375" y="408" font-size="12" text-anchor="middle">Time per short command (seconds)</text>
<text class="ink2" x="18" y="215" font-size="12" text-anchor="middle" transform="rotate(-90 18 215)">Word errors (fewer is higher)</text>
<circle class="s1" cx="106.6" cy="309.2" r="7"/>
<text class="ink" x="118.6" y="307.2" font-size="13" font-weight="600" text-anchor="start">Zipformer</text>
<text class="ink2" x="118.6" y="323.2" font-size="12" text-anchor="start">17.9% errors · 0.3 s · ~170 MB</text>
<circle class="s1" cx="131.0" cy="128.0" r="7"/>
<text class="ink" x="143.0" y="126.0" font-size="13" font-weight="600" text-anchor="start">Moonshine</text>
<text class="ink2" x="143.0" y="142.0" font-size="12" text-anchor="start">10.4% errors · 0.5 s · ~380 MB</text>
<circle class="s1" cx="204.2" cy="103.8" r="7"/>
<text class="ink" x="216.2" y="101.8" font-size="13" font-weight="600" text-anchor="start">Parakeet</text>
<text class="ink2" x="216.2" y="117.8" font-size="12" text-anchor="start">9.4% errors · 1.1 s · ~810 MB</text>
<circle class="s1" cx="631.2" cy="241.6" r="7"/>
<text class="ink" x="619.2" y="239.6" font-size="13" font-weight="600" text-anchor="end">Whisper small</text>
<text class="ink2" x="619.2" y="255.6" font-size="12" text-anchor="end">15.1% errors · 4.6 s · ~950 MB</text>
</svg>
