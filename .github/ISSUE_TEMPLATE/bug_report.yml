name: Bug report
description: "Something in Oread doesn't work as it should"
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened"
      description: "And what you expected instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Oread version"
      description: "The first line of `docker compose logs oread`, like \"Oread 1.0.0 starting\"."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Listening device and client"
      description: "Like: Home Assistant Voice PE through Home Assistant 2025.10."
  - type: input
    id: models
    attributes:
      label: "Speech and voice models"
      description: "From the Devices page, like: Moonshine + TitaNet small."
  - type: input
    id: server
    attributes:
      label: "Server"
      description: "CPU, cores, memory, OS (the Stats page shows them)."
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "From `docker compose logs oread`. Leave out anything private: names, addresses, tokens."
      render: text
